name: Bug Scouter

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions: {}

concurrency:
  group: bug-scouter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: Build exact PR wheel
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'bug-scouter')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR commit without credentials
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build azure-ai-ml wheel
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --outdir "$RUNNER_TEMP/bugscouter-input" sdk/ml/azure-ai-ml
          cp sdk/ml/azure-ai-ml/README.md "$RUNNER_TEMP/bugscouter-input/README.md"
          test "$(find "$RUNNER_TEMP/bugscouter-input" -maxdepth 1 -name 'azure_ai_ml-*.whl' | wc -l)" -eq 1

      - name: Upload exact-SHA inputs
        uses: actions/upload-artifact@v7
        with:
          name: bugscouter-input-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/bugscouter-input
          if-no-files-found: error
          retention-days: 1

  invoke:
    name: Run Bug Scouter
    needs: build-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout trusted automation only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download exact-SHA inputs
        uses: actions/download-artifact@v8
        with:
          name: bugscouter-input-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/bugscouter-input

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.BUGSCOUTER_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.BUGSCOUTER_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.BUGSCOUTER_AZURE_SUBSCRIPTION_ID }}

      - name: Invoke and publish Bug Scouter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python .github/scripts/run_bugscouter.py
          --event "$GITHUB_EVENT_PATH"
          --endpoint "https://cog-bugscouter-int.services.ai.azure.com/api/projects/bug-scouter-hosted-agent-dev/agents/bug-scouter-hosted-agent/endpoint/protocols/invocations"
          --storage-account bugscouterintstore
          --container bugscouter-pr-input
          --wheel "$(find "$RUNNER_TEMP/bugscouter-input" -maxdepth 1 -name 'azure_ai_ml-*.whl' -print -quit)"
          --document "$RUNNER_TEMP/bugscouter-input/README.md"
          --output "$RUNNER_TEMP/bugscouter-result.json"
          --target-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --publish

      - name: Upload Bug Scouter result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bugscouter-result-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/bugscouter-result.json
          if-no-files-found: warn
          retention-days: 7
